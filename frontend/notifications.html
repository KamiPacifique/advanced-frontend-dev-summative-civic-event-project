<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications · CivicConnect</title>
  <meta name="description" content="Your in-app notifications: new events, announcements, promos and registration updates.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="bg-canvas font-sans text-ink antialiased min-h-screen flex flex-col">
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="app-header"></div>

  <main id="main" tabindex="-1" class="flex-1">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-10">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="text-overline uppercase text-brand">Inbox</p>
          <h1 class="mt-1 text-2xl sm:text-3xl font-extrabold tracking-tight">Notifications</h1>
          <p class="mt-2 text-ink-secondary">Updates about new events, announcements, promos and your registrations.</p>
        </div>
        <div class="flex gap-2">
          <button type="button" id="refresh" class="inline-flex items-center gap-2 h-10 px-4 rounded-lg border border-line bg-white text-sm font-semibold hover:bg-subtle"><span data-icon="refresh"></span>Refresh</button>
          <button type="button" id="mark-all" class="inline-flex items-center gap-2 h-10 px-4 rounded-lg bg-brand text-white text-sm font-semibold hover:bg-brand-hover"><span data-icon="check-check"></span>Mark all read</button>
        </div>
      </div>
      <div id="admin-note" class="mt-5 empty:hidden"></div>
      <div class="mt-6 bg-white rounded-2xl border border-line shadow-card overflow-hidden">
        <div id="tabs" class="px-4 sm:px-5 pt-2 border-b border-line"></div>
        <div id="list" aria-live="polite"></div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/core/utils.js"></script>
  <script src="assets/js/core/icons.js"></script>
  <script src="assets/js/core/auth.js"></script>
  <script src="assets/js/core/api.js"></script>
  <script src="assets/js/core/cache.js"></script>
  <script src="assets/js/core/ui.js"></script>
  <script src="assets/js/components/layout.js"></script>
  <script src="assets/js/components/notifications.js"></script>
  <script src="assets/js/pages/notifications.js"></script>
</body>
</html>
