<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrations · CivicConnect Admin</title>
  <meta name="description" content="See who registered for each event and the feedback they left.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="bg-canvas font-sans text-ink antialiased min-h-screen">
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="lg:pl-64 min-h-screen flex flex-col">
    <div id="app-topbar"></div>
    <main id="main" tabindex="-1" class="flex-1 px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Registrations &amp; feedback</h1>
      <p class="mt-1 text-sm text-ink-secondary">Pick an event to see its confirmed attendees and feedback.</p>

      <div class="mt-6 flex flex-col sm:flex-row sm:items-end gap-3">
        <div class="sm:w-96">
          <label for="event" class="block text-sm font-semibold mb-1.5">Event</label>
          <select id="event" class="block w-full h-11 rounded-lg border border-line bg-white px-3 text-sm shadow-sm focus:border-brand focus:ring-4 focus:ring-brand-soft focus-visible:outline-none" disabled><option>Loading events…</option></select>
        </div>
        <button type="button" id="export" class="inline-flex items-center justify-center gap-2 h-11 px-4 rounded-lg border border-line bg-white text-sm font-semibold hover:bg-subtle disabled:opacity-50" disabled><span data-icon="download"></span>Export attendees CSV</button>
      </div>

      <div id="summary" class="mt-6 grid gap-4 sm:grid-cols-3"></div>

      <div class="mt-6 grid gap-6 xl:grid-cols-[1fr_24rem] items-start">
        <section class="bg-white rounded-2xl border border-line shadow-card overflow-x-auto" aria-labelledby="att-h">
          <h2 id="att-h" class="px-5 pt-5 font-bold">Attendees</h2>
          <table class="mt-3 w-full text-sm text-left min-w-[36rem]">
            <thead class="bg-subtle text-overline uppercase text-ink-muted"><tr><th scope="col" class="px-4 py-3">Name</th><th scope="col" class="px-4 py-3">Email</th><th scope="col" class="px-4 py-3">Registered</th><th scope="col" class="px-4 py-3">Status</th></tr></thead>
            <tbody id="att"></tbody>
          </table>
        </section>
        <section class="bg-white rounded-2xl border border-line shadow-card p-5" aria-labelledby="fb-h">
          <h2 id="fb-h" class="font-bold">Feedback</h2>
          <ul id="fb" class="mt-3 divide-y divide-line"></ul>
        </section>
      </div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/icons.js"></script>
  <script src="../assets/js/core/auth.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/cache.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/components/layout.js"></script>
  <script src="../assets/js/components/notifications.js"></script>
  <script src="../assets/js/components/events-shared.js"></script>
  <script src="../assets/js/pages/admin-registrations.js"></script>
</body>
</html>
