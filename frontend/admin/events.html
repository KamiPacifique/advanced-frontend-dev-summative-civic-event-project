<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage events · CivicConnect Admin</title>
  <meta name="description" content="Create, edit and delete community events.">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body class="bg-canvas font-sans text-ink antialiased min-h-screen">
  <a href="#main" class="skip-link">Skip to content</a>
  <div class="lg:pl-64 min-h-screen flex flex-col">
    <div id="app-topbar"></div>
    <main id="main" tabindex="-1" class="flex-1 px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Events</h1>
          <p class="mt-1 text-sm text-ink-secondary">All events, including drafts. Only published events are visible to users.</p>
        </div>
        <a href="event-form.html" class="inline-flex items-center gap-2 h-10 px-4 rounded-lg bg-brand text-white text-sm font-semibold hover:bg-brand-hover"><span data-icon="plus"></span>Create event</a>
      </div>

      <div class="mt-6 flex flex-col md:flex-row md:items-center gap-3">
        <div class="relative md:w-80">
          <label for="q" class="sr-only">Search events</label>
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-ink-muted pointer-events-none" data-icon="search"></span>
          <input id="q" type="search" placeholder="Search events…" autocomplete="off" class="block w-full h-10 rounded-lg border border-line bg-white pl-10 pr-3 text-sm shadow-sm focus:border-brand focus:ring-4 focus:ring-brand-soft focus-visible:outline-none">
        </div>
        <div id="chips" class="flex flex-wrap gap-2" role="group" aria-label="Filter events"></div>
      </div>

      <div class="mt-5 bg-white rounded-2xl border border-line shadow-card overflow-x-auto">
        <table class="w-full text-sm text-left min-w-[52rem]">
          <caption class="sr-only">All events</caption>
          <thead class="bg-subtle text-overline uppercase text-ink-muted">
            <tr><th scope="col" class="px-4 py-3 sticky left-0 bg-subtle">Event</th><th scope="col" class="px-4 py-3">Date</th><th scope="col" class="px-4 py-3">Status</th><th scope="col" class="px-4 py-3">Regs</th><th scope="col" class="px-4 py-3 text-right">Actions</th></tr>
          </thead>
          <tbody id="rows" aria-busy="true"></tbody>
        </table>
      </div>
      <div class="mt-4 flex flex-wrap items-center justify-between gap-3"><p id="count" class="text-sm text-ink-muted" aria-live="polite"></p><div id="pager"></div></div>
    </main>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/core/utils.js"></script>
  <script src="../assets/js/core/icons.js"></script>
  <script src="../assets/js/core/auth.js"></script>
  <script src="../assets/js/core/api.js"></script>
  <script src="../assets/js/core/cache.js"></script>
  <script src="../assets/js/core/ui.js"></script>
  <script src="../assets/js/components/layout.js"></script>
  <script src="../assets/js/components/notifications.js"></script>
  <script src="../assets/js/components/cards.js"></script>
  <script src="../assets/js/components/events-shared.js"></script>
  <script src="../assets/js/pages/admin-events.js"></script>
</body>
</html>
